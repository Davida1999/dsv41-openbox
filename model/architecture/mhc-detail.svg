<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1040" viewBox="0 0 1080 1040"><title>mHC 内部计算与延迟系数交接</title><desc>Logical dimensions, zero-based layers, source symbols in node tooltips. Solid arrows carry data; dashed lines denote control, coefficients or detail expansion.</desc><defs><marker id="20314c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#20314c"/></marker><marker id="2563b5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563b5"/></marker><marker id="087f87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f87"/></marker><marker id="7951ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7951ac"/></marker><marker id="b57413" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b57413"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial Unicode MS, Hiragino Sans GB, sans-serif"><rect x="1" y="1" width="1078" height="1038" rx="18" fill="white" stroke="#2563b5" stroke-width="2" stroke-dasharray="10 7"/><text x="30" y="52" font-size="35" text-anchor="start" fill="#2563b5" font-weight="700">03  mHC：四路 residual 怎样进出子层</text><text x="30" y="92" font-size="23" text-anchor="start" fill="#5c6d83" font-weight="400">Attention 与 MoE 各用一套参数；非普通的 x + f(x)</text><g id="h-input" data-source=""><title>H ∈ [N, 4, 5120]</title><rect x="270" y="140" width="540" height="75" rx="12" fill="#edf4ff" stroke="#2563b5" stroke-width="2"/><text x="540.0" y="170.58" font-size="26" text-anchor="middle" fill="#2563b5" font-weight="700">H ∈ [N, 4, 5120]</text><text x="540.0" y="201.58" font-size="23" text-anchor="middle" fill="#2563b5" font-weight="400">前一子层传来的 pre_mix ∈ [N, 4]</text></g><g id="h-collapse" data-source=""><title>按传入 pre_mix 合并四路</title><rect x="55" y="300" width="445" height="110" rx="12" fill="#edf4ff" stroke="#2563b5" stroke-width="2"/><text x="277.5" y="331.92" font-size="24" text-anchor="middle" fill="#2563b5" font-weight="700">按传入 pre_mix 合并四路</text><text x="277.5" y="362.92" font-size="23" text-anchor="middle" fill="#2563b5" font-weight="400">x = Σᵢ pre_mixᵢ × Hᵢ</text><text x="277.5" y="393.92" font-size="23" text-anchor="middle" fill="#2563b5" font-weight="400">x ∈ [N, 5120] → RMSNorm</text></g><g id="h-coeff" data-source=""><title>H flatten → RMS / Linear</title><rect x="580" y="300" width="445" height="110" rx="12" fill="#edf4ff" stroke="#2563b5" stroke-width="2"/><text x="802.5" y="331.92" font-size="24" text-anchor="middle" fill="#2563b5" font-weight="700">H flatten → RMS / Linear</text><text x="802.5" y="362.92" font-size="23" text-anchor="middle" fill="#2563b5" font-weight="400">20480 → 24 个系数</text><text x="802.5" y="393.92" font-size="23" text-anchor="middle" fill="#2563b5" font-weight="400">4 pre + 4 post + 4 × 4 comb</text></g><path d="M540,215 L540,250 L277,250 L277,300" fill="none" stroke="#2563b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#2563b5)"/><path d="M540,215 L540,250 L802,250 L802,300" fill="none" stroke="#2563b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#2563b5)"/><g id="h-sub" data-source=""><title>Attention 或 MoE</title><rect x="55" y="490" width="445" height="80" rx="12" fill="#edf4ff" stroke="#2563b5" stroke-width="2"/><text x="277.5" y="523.08" font-size="26" text-anchor="middle" fill="#2563b5" font-weight="700">Attention 或 MoE</text><text x="277.5" y="554.08" font-size="23" text-anchor="middle" fill="#2563b5" font-weight="400">y ∈ [N, 5120]</text></g><path d="M277,410 L277,490" fill="none" stroke="#2563b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#2563b5)"/><g id="h-sk" data-source="model.py:DeepseekV41DecoderLayer.hc_pre; npu_hc_pre_v3"><title>model.py:DeepseekV41DecoderLayer.hc_pre; npu_hc_pre_v3</title><rect x="580" y="490" width="445" height="145" rx="12" fill="#edf4ff" stroke="#2563b5" stroke-width="2"/><text x="802.5" y="523.92" font-size="24" text-anchor="middle" fill="#2563b5" font-weight="700">约束系数 / Sinkhorn ×20</text><text x="802.5" y="554.92" font-size="23" text-anchor="middle" fill="#2563b5" font-weight="400">post ∈ [N, 4]</text><text x="802.5" y="585.92" font-size="23" text-anchor="middle" fill="#2563b5" font-weight="400">comb ∈ [N, 4, 4]</text><text x="802.5" y="616.92" font-size="23" text-anchor="middle" fill="#2563b5" font-weight="400">next_pre ∈ [N, 4]</text></g><path d="M802,410 L802,490" fill="none" stroke="#2563b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#2563b5)"/><g id="h-post" data-source="model.py:DeepseekV41DecoderLayer.hc_post"><title>model.py:DeepseekV41DecoderLayer.hc_post</title><rect x="155" y="710" width="770" height="100" rx="12" fill="#edf4ff" stroke="#2563b5" stroke-width="2"/><text x="540.0" y="737.25" font-size="25" text-anchor="middle" fill="#2563b5" font-weight="700">mHC post：混合 residual + 广播子层输出</text><text x="540.0" y="768.25" font-size="23" text-anchor="middle" fill="#2563b5" font-weight="400">H′ⱼ = Σᵢ combᵢⱼ × Hᵢ + postⱼ × y</text><text x="540.0" y="799.25" font-size="23" text-anchor="middle" fill="#2563b5" font-weight="400">H′ ∈ [N, 4, 5120]</text></g><path d="M277,570 L277,650 L370,650 L370,710" fill="none" stroke="#2563b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#2563b5)"/><path d="M802,635 L802,670 L710,670 L710,710" fill="none" stroke="#2563b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#2563b5)"/><path d="M810,177 L1050,177 L1050,760 L925,760" fill="none" stroke="#2563b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#2563b5)"/><text x="1050" y="675" font-size="23" text-anchor="middle" fill="#2563b5" font-weight="400">H</text><g id="h-next" data-source=""><title>H′ 与 next_pre 一起交给下一子层</title><rect x="155" y="900" width="770" height="85" rx="12" fill="#edf4ff" stroke="#2563b5" stroke-width="2"/><text x="540.0" y="935.25" font-size="25" text-anchor="middle" fill="#2563b5" font-weight="700">H′ 与 next_pre 一起交给下一子层</text><text x="540.0" y="966.25" font-size="23" text-anchor="middle" fill="#2563b5" font-weight="400">Attention 产生的 attn_pre → MoE；ffn_pre → 下一层</text></g><path d="M540,810 L540,900" fill="none" stroke="#2563b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#2563b5)"/><path d="M1025,547 L1060,547 L1060,942 L925,942" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#7951ac)"/><text x="1000" y="867" font-size="22" text-anchor="middle" fill="#7951ac" font-weight="400">next_pre</text></g></svg>