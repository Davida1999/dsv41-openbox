<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="3580" viewBox="0 0 1100 3580"><title>输入到输出与单层完整执行顺序</title><desc>Logical dimensions, zero-based layers, source symbols in node tooltips. Solid arrows carry data; dashed lines denote control, coefficients or detail expansion.</desc><defs><marker id="20314c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#20314c"/></marker><marker id="2563b5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563b5"/></marker><marker id="087f87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f87"/></marker><marker id="7951ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7951ac"/></marker><marker id="b57413" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b57413"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial Unicode MS, Hiragino Sans GB, sans-serif"><rect x="1" y="1" width="1098" height="3578" rx="18" fill="white" stroke="#20314c" stroke-width="2" stroke-dasharray="10 7"/><text x="30" y="52" font-size="35" text-anchor="start" fill="#20314c" font-weight="700">主干：输入 → 40 层 → 输出</text><text x="30" y="92" font-size="23" text-anchor="start" fill="#5c6d83" font-weight="400">N = 当前展开的 token 数；所有尺寸均为逻辑尺寸</text><g id="t-token" data-source=""><title>文本 token → Token Embedding</title><rect x="205" y="135" width="690" height="85" rx="12" fill="#f3f5f8" stroke="#20314c" stroke-width="2"/><text x="550.0" y="170.58" font-size="26" text-anchor="middle" fill="#20314c" font-weight="700">文本 token → Token Embedding</text><text x="550.0" y="201.58" font-size="23" text-anchor="middle" fill="#20314c" font-weight="400">vocab 129280 → [N, 5120]</text></g><g id="t-merge" data-source=""><title>在 image placeholder 位置替换 embedding</title><rect x="205" y="300" width="690" height="85" rx="12" fill="#f3f5f8" stroke="#20314c" stroke-width="2"/><text x="550.0" y="335.58" font-size="26" text-anchor="middle" fill="#20314c" font-weight="700">在 image placeholder 位置替换 embedding</text><text x="550.0" y="366.58" font-size="23" text-anchor="middle" fill="#20314c" font-weight="400">← 视觉 Aligner 输出 [M, 5120]</text></g><g id="t-expand" data-source=""><title>repeat 到 4 路 mHC residual</title><rect x="205" y="465" width="690" height="85" rx="12" fill="#f3f5f8" stroke="#20314c" stroke-width="2"/><text x="550.0" y="500.58" font-size="26" text-anchor="middle" fill="#20314c" font-weight="700">repeat 到 4 路 mHC residual</text><text x="550.0" y="531.5799999999999" font-size="23" text-anchor="middle" fill="#20314c" font-weight="400">H₀: [N, 4, 5120]；pre_mix = [1,0,0,0]</text></g><path d="M550,220 L550,300" fill="none" stroke="#20314c" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#20314c)"/><path d="M550,385 L550,465" fill="none" stroke="#20314c" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#20314c)"/><rect x="60" y="650" width="980" height="2260" rx="18" fill="white" stroke="#2563b5" stroke-width="2" stroke-dasharray="10 7"/><text x="95" y="700" font-size="32" text-anchor="start" fill="#2563b5" font-weight="700">Decoder Lℓ ×40   ℓ=0…39</text><text x="550" y="755" font-size="22" text-anchor="middle" fill="#2563b5" font-weight="400">L0–1: SWA  |  L2–19: C2 + SWA  |  L20–39: C1 + SWA</text><g id="t-engram" data-source=""><title>若 ℓ∈{1,14}：先注入 Engram</title><rect x="205" y="825" width="690" height="95" rx="12" fill="#f4effb" stroke="#7951ac" stroke-width="2"/><text x="550.0" y="865.58" font-size="26" text-anchor="middle" fill="#7951ac" font-weight="700">若 ℓ∈{1,14}：先注入 Engram</text><text x="550.0" y="896.58" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">其他层直接通过；H 保持 [N,4,5120]</text></g><path d="M550,550 L550,825" fill="none" stroke="#20314c" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#20314c)"/><g id="t-hpre-a" data-source=""><title>① mHC pre (Attention)</title><rect x="205" y="1010" width="690" height="95" rx="12" fill="#edf4ff" stroke="#2563b5" stroke-width="2"/><text x="550.0" y="1050.58" font-size="26" text-anchor="middle" fill="#2563b5" font-weight="700">① mHC pre (Attention)</text><text x="550.0" y="1081.58" font-size="23" text-anchor="middle" fill="#2563b5" font-weight="400">输入 pre_mix → x [N,5120]；产生 attn 系数</text></g><path d="M550,920 L550,1010" fill="none" stroke="#20314c" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#20314c)"/><g id="t-rms-a" data-source=""><title>② RMSNorm (ε = 1e−20)</title><rect x="205" y="1190" width="690" height="65" rx="12" fill="#edf4ff" stroke="#2563b5" stroke-width="2"/><text x="550.0" y="1231.08" font-size="26" text-anchor="middle" fill="#2563b5" font-weight="700">② RMSNorm (ε = 1e−20)</text></g><path d="M550,1105 L550,1190" fill="none" stroke="#20314c" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#20314c)"/><g id="t-attn" data-source=""><title>③ 本层 Q + 本层 SWA + 共享长程 KV</title><rect x="205" y="1350" width="690" height="100" rx="12" fill="#edf4ff" stroke="#2563b5" stroke-width="2"/><text x="550.0" y="1393.08" font-size="26" text-anchor="middle" fill="#2563b5" font-weight="700">③ 本层 Q + 本层 SWA + 共享长程 KV</text><text x="550.0" y="1424.08" font-size="23" text-anchor="middle" fill="#2563b5" font-weight="400">Attention 详见右侧 A；输出 [N,5120]</text></g><path d="M550,1255 L550,1350" fill="none" stroke="#20314c" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#20314c)"/><g id="t-hpost-a" data-source=""><title>④ mHC post (Attention)</title><rect x="205" y="1540" width="690" height="100" rx="12" fill="#edf4ff" stroke="#2563b5" stroke-width="2"/><text x="550.0" y="1583.08" font-size="26" text-anchor="middle" fill="#2563b5" font-weight="700">④ mHC post (Attention)</text><text x="550.0" y="1614.08" font-size="23" text-anchor="middle" fill="#2563b5" font-weight="400">Attention 输出 + 原 H + post / comb → Hₐ</text></g><path d="M550,1450 L550,1540" fill="none" stroke="#20314c" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#20314c)"/><g id="t-hpre-f" data-source=""><title>⑤ mHC pre (FFN)</title><rect x="205" y="1765" width="690" height="95" rx="12" fill="#fff6e6" stroke="#b57413" stroke-width="2"/><text x="550.0" y="1805.58" font-size="26" text-anchor="middle" fill="#b57413" font-weight="700">⑤ mHC pre (FFN)</text><text x="550.0" y="1836.58" font-size="23" text-anchor="middle" fill="#b57413" font-weight="400">使用 attn_pre；产生 ffn_post / comb / ffn_pre</text></g><path d="M550,1640 L550,1765" fill="none" stroke="#20314c" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#20314c)"/><g id="t-rms-f" data-source=""><title>⑥ RMSNorm + FP32 router 输入</title><rect x="205" y="1945" width="690" height="85" rx="12" fill="#fff6e6" stroke="#b57413" stroke-width="2"/><text x="550.0" y="1980.58" font-size="26" text-anchor="middle" fill="#b57413" font-weight="700">⑥ RMSNorm + FP32 router 输入</text><text x="550.0" y="2011.58" font-size="23" text-anchor="middle" fill="#b57413" font-weight="400">专家计算与路由共享同一次归一化结果</text></g><path d="M550,1860 L550,1945" fill="none" stroke="#20314c" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#20314c)"/><g id="t-moe" data-source=""><title>⑦ MoE：6 routed experts + 1 shared</title><rect x="205" y="2140" width="690" height="100" rx="12" fill="#fff6e6" stroke="#b57413" stroke-width="2"/><text x="550.0" y="2183.08" font-size="26" text-anchor="middle" fill="#b57413" font-weight="700">⑦ MoE：6 routed experts + 1 shared</text><text x="550.0" y="2214.08" font-size="23" text-anchor="middle" fill="#b57413" font-weight="400">专家内部 SwiGLU 与路由权重见右侧 B</text></g><path d="M550,2030 L550,2140" fill="none" stroke="#20314c" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#20314c)"/><g id="t-hpost-f" data-source=""><title>⑧ mHC post (FFN)</title><rect x="205" y="2335" width="690" height="100" rx="12" fill="#fff6e6" stroke="#b57413" stroke-width="2"/><text x="550.0" y="2378.08" font-size="26" text-anchor="middle" fill="#b57413" font-weight="700">⑧ mHC post (FFN)</text><text x="550.0" y="2409.08" font-size="23" text-anchor="middle" fill="#b57413" font-weight="400">MoE 输出 + Hₐ + ffn_post / comb → Hℓ₊₁</text></g><path d="M550,2240 L550,2335" fill="none" stroke="#20314c" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#20314c)"/><path d="M205,1057 L130,1057 L130,1590 L205,1590" fill="none" stroke="#2563b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#2563b5)"/><text x="140" y="1480" font-size="22" text-anchor="start" fill="#2563b5" font-weight="400">H 残差旁路</text><path d="M205,1812 L130,1812 L130,2385 L205,2385" fill="none" stroke="#b57413" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#b57413)"/><text x="140" y="2285" font-size="22" text-anchor="start" fill="#b57413" font-weight="400">Hₐ 残差旁路</text><path d="M895,1057 L970,1057 L970,1812 L895,1812" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#7951ac)"/><text x="985" y="1680" font-size="22" text-anchor="end" fill="#7951ac" font-weight="400">attn_pre</text><g id="t-state" data-source=""><title>交给下一层：Hℓ₊₁ 与 ffn_pre</title><rect x="205" y="2560" width="690" height="100" rx="12" fill="#f3f5f8" stroke="#20314c" stroke-width="2"/><text x="550.0" y="2602.75" font-size="25" text-anchor="middle" fill="#20314c" font-weight="700">交给下一层：Hℓ₊₁ 与 ffn_pre</text><text x="550.0" y="2633.75" font-size="23" text-anchor="middle" fill="#20314c" font-weight="400">[N,4,5120] + [N,4]；每层独立 Q 与 SWA</text></g><path d="M550,2435 L550,2560" fill="none" stroke="#20314c" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#20314c)"/><path d="M895,2610 L1010,2610 L1010,810 L895,810" fill="none" stroke="#20314c" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#20314c)"/><text x="550" y="2770" font-size="24" text-anchor="middle" fill="#5c6d83" font-weight="400">重复框只代表执行顺序；KV／索引共享见下方层图</text><g id="t-collapse" data-source=""><title>40 层后：按最后 ffn_pre collapse</title><rect x="205" y="3020" width="690" height="85" rx="12" fill="#f3f5f8" stroke="#20314c" stroke-width="2"/><text x="550.0" y="3055.58" font-size="26" text-anchor="middle" fill="#20314c" font-weight="700">40 层后：按最后 ffn_pre collapse</text><text x="550.0" y="3086.58" font-size="23" text-anchor="middle" fill="#20314c" font-weight="400">Σᵢ pre_mixᵢ × Hᵢ → [N,5120]</text></g><path d="M550,2660 L550,3020" fill="none" stroke="#20314c" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#20314c)"/><g id="t-finalnorm" data-source=""><title>最终 RMSNorm</title><rect x="205" y="3170" width="690" height="65" rx="12" fill="#f3f5f8" stroke="#20314c" stroke-width="2"/><text x="550.0" y="3211.41" font-size="27" text-anchor="middle" fill="#20314c" font-weight="700">最终 RMSNorm</text></g><path d="M550,3105 L550,3170" fill="none" stroke="#20314c" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#20314c)"/><g id="t-lmhead" data-source=""><title>LM Head 5120 → 129280 logits</title><rect x="205" y="3310" width="690" height="85" rx="12" fill="#f3f5f8" stroke="#20314c" stroke-width="2"/><text x="550.0" y="3345.58" font-size="26" text-anchor="middle" fill="#20314c" font-weight="700">LM Head 5120 → 129280 logits</text><text x="550.0" y="3376.58" font-size="23" text-anchor="middle" fill="#20314c" font-weight="400">Embedding 与 LM Head 不绑定权重</text></g><path d="M550,3235 L550,3310" fill="none" stroke="#20314c" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#20314c)"/><g id="t-sample" data-source=""><title>采样 / 输出下一个 token</title><rect x="205" y="3470" width="690" height="65" rx="12" fill="#f3f5f8" stroke="#20314c" stroke-width="2"/><text x="550.0" y="3511.41" font-size="27" text-anchor="middle" fill="#20314c" font-weight="700">采样 / 输出下一个 token</text></g><