<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1100" viewBox="0 0 1080 1100"><title>Engram 条件记忆内部计算</title><desc>Logical dimensions, zero-based layers, source symbols in node tooltips. Solid arrows carry data; dashed lines denote control, coefficients or detail expansion.</desc><defs><marker id="20314c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#20314c"/></marker><marker id="2563b5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563b5"/></marker><marker id="087f87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f87"/></marker><marker id="7951ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7951ac"/></marker><marker id="b57413" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b57413"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial Unicode MS, Hiragino Sans GB, sans-serif"><rect x="1" y="1" width="1078" height="1098" rx="18" fill="white" stroke="#7951ac" stroke-width="2" stroke-dasharray="10 7"/><text x="30" y="52" font-size="35" text-anchor="start" fill="#7951ac" font-weight="700">02  Engram：检索 → 逐流门控 → 注入</text><text x="30" y="92" font-size="23" text-anchor="start" fill="#5c6d83" font-weight="400">仅 L1、L14；在 Decoder 的 attention mHC pre 之前执行</text><g id="e-token" data-source=""><title>历史 token / lookback</title><rect x="65" y="140" width="440" height="85" rx="12" fill="#f4effb" stroke="#7951ac" stroke-width="2"/><text x="285.0" y="175.25" font-size="25" text-anchor="middle" fill="#7951ac" font-weight="700">历史 token / lookback</text><text x="285.0" y="206.25" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">2 / 3 / 4-gram；排除图像区域</text></g><g id="e-hash" data-source=""><title>n-gram hash → 表行索引</title><rect x="65" y="270" width="440" height="85" rx="12" fill="#f4effb" stroke="#7951ac" stroke-width="2"/><text x="285.0" y="305.25" font-size="25" text-anchor="middle" fill="#7951ac" font-weight="700">n-gram hash → 表行索引</text><text x="285.0" y="336.25" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">3 种 n-gram × 8 heads</text></g><path d="M285,225 L285,270" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><g id="e-lookup" data-source=""><title>Embedding lookup → concat</title><rect x="65" y="400" width="440" height="85" rx="12" fill="#f4effb" stroke="#7951ac" stroke-width="2"/><text x="285.0" y="435.25" font-size="25" text-anchor="middle" fill="#7951ac" font-weight="700">Embedding lookup → concat</text><text x="285.0" y="466.25" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">3 × 8 × 256 = 6144 channels</text></g><path d="M285,355 L285,400" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><g id="e-wkv" data-source="engram/layer.py:AscendEngram.forward"><title>engram/layer.py:AscendEngram.forward</title><rect x="65" y="530" width="440" height="85" rx="12" fill="#f4effb" stroke="#7951ac" stroke-width="2"/><text x="285.0" y="565.25" font-size="25" text-anchor="middle" fill="#7951ac" font-weight="700">Linear Wkv 6144 → 25600</text><text x="285.0" y="596.25" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">K: 4 × 5120；V: 5120</text></g><path d="M285,485 L285,530" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><g id="e-hidden" data-source=""><title>当前四路残差 H</title><rect x="590" y="140" width="420" height="85" rx="12" fill="#f4effb" stroke="#7951ac" stroke-width="2"/><text x="800.0" y="175.25" font-size="25" text-anchor="middle" fill="#7951ac" font-weight="700">当前四路残差 H</text><text x="800.0" y="206.25" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">[N, 4, 5120]</text></g><g id="e-key" data-source=""><title>每流 K + learned q/k weights</title><rect x="590" y="400" width="420" height="85" rx="12" fill="#f4effb" stroke="#7951ac" stroke-width="2"/><text x="800.0" y="434.59" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="700">每流 K + learned q/k weights</text><text x="800.0" y="465.59" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">与 H 做 RMS 归一化内积</text></g><path d="M505,572 L550,572 L550,442 L590,442" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><path d="M800,225 L800,400" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><g id="e-gate" data-source="engram/common.py:engram_gate"><title>engram/common.py:engram_gate</title><rect x="590" y="570" width="420" height="115" rx="12" fill="#f4effb" stroke="#7951ac" stroke-width="2"/><text x="800.0" y="604.42" font-size="24" text-anchor="middle" fill="#7951ac" font-weight="700">signed sqrt → sigmoid</text><text x="800.0" y="635.42" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">s = normalized weighted dot / √5120</text><text x="800.0" y="666.42" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">g = σ(sign(s) × √|s|) → [N, 4]</text></g><path d="M800,485 L800,570" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><g id="e-mask" data-source=""><title>token mask → 无效 token 的 g=0</title><rect x="590" y="740" width="420" height="65" rx="12" fill="#f4effb" stroke="#7951ac" stroke-width="2"/><text x="800.0" y="780.09" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="700">token mask → 无效 token 的 g=0</text></g><path d="M800,685 L800,740" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><circle cx="540" cy="890" r="25" fill="white" stroke="#7951ac" stroke-width="2.8"/><text x="540" y="899" font-size="30" text-anchor="middle" fill="#7951ac" font-weight="700">×</text><path d="M285,615 L285,890 L515,890" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><text x="285" y="853" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">V 广播到 4 路</text><path d="M800,805 L800,890 L565,890" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><circle cx="540" cy="990" r="22" fill="white" stroke="#7951ac" stroke-width="2.8"/><text x="540" y="999" font-size="30" text-anchor="middle" fill="#7951ac" font-weight="700">+</text><path d="M540,915 L540,968" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><path d="M1010,182 L1040,182 L1040,990 L562,990" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><text x="930" y="955" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">H 旁路</text><text x="540" y="1055" font-size="24" text-anchor="middle" fill="#7951ac" font-weight="400">H′ = H + g[..., None] × V[:, None, :] → [N, 4, 5120]</text></g></svg>