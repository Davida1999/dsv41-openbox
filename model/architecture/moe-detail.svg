<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1410" viewBox="0 0 1440 1410"><title>MoE 路由、专家内部与聚合</title><desc>Logical dimensions, zero-based layers, source symbols in node tooltips. Solid arrows carry data; dashed lines denote control, coefficients or detail expansion.</desc><defs><marker id="20314c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#20314c"/></marker><marker id="2563b5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563b5"/></marker><marker id="087f87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f87"/></marker><marker id="7951ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7951ac"/></marker><marker id="b57413" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b57413"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial Unicode MS, Hiragino Sans GB, sans-serif"><rect x="1" y="1" width="1438" height="1408" rx="18" fill="white" stroke="#b57413" stroke-width="2" stroke-dasharray="10 7"/><text x="30" y="52" font-size="35" text-anchor="start" fill="#b57413" font-weight="700">B  MoE：路由计算与专家内部 SwiGLU</text><text x="30" y="92" font-size="23" text-anchor="start" fill="#5c6d83" font-weight="400">40 层均有 MoE；384 routed / Top-6 + 1 shared；中间维度 2304</text><g id="m-input" data-source=""><title>归一化 x [N,5120]</title><rect x="420" y="135" width="600" height="75" rx="12" fill="#fff6e6" stroke="#b57413" stroke-width="2"/><text x="720.0" y="165.91" font-size="27" text-anchor="middle" fill="#b57413" font-weight="700">归一化 x [N,5120]</text><text x="720.0" y="196.91" font-size="23" text-anchor="middle" fill="#b57413" font-weight="400">FP32 副本用于 router</text></g><path d="M720,210 L720,245 L340,245 L340,285" fill="none" stroke="#b57413" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#b57413)"/><path d="M720,245 L1100,245 L1100,285" fill="none" stroke="#b57413" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#b57413)"/><g id="m-router" data-source="model.py:DeepseekV41MoE.__init__; forward"><title>model.py:DeepseekV41MoE.__init__; forward</title><rect x="70" y="285" width="575" height="85" rx="12" fill="#fff6e6" stroke="#b57413" stroke-width="2"/><text x="357.5" y="320.25" font-size="25" text-anchor="middle" fill="#b57413" font-weight="700">Router Linear 5120 → 384</text><text x="357.5" y="351.25" font-size="23" text-anchor="middle" fill="#b57413" font-weight="400">sqrtsoftplus → scores + bias 选 Top-6</text></g><g id="m-shared" data-source=""><title>1 个 shared expert：每 token 都算</title><rect x="840" y="285" width="520" height="85" rx="12" fill="#fff6e6" stroke="#b57413" stroke-width="2"/><text x="1100.0" y="320.25" font-size="25" text-anchor="middle" fill="#b57413" font-weight="700">1 个 shared expert：每 token 都算</text><text x="1100.0" y="351.25" font-size="23" text-anchor="middle" fill="#b57413" font-weight="400">不占 routed Top-6 名额</text></g><g id="m-weight" data-source=""><title>Top-6 权重归一化 → dispatch</title><rect x="70" y="430" width="575" height="95" rx="12" fill="#fff6e6" stroke="#b57413" stroke-width="2"/><text x="357.5" y="454.75" font-size="25" text-anchor="middle" fill="#b57413" font-weight="700">Top-6 权重归一化 → dispatch</text><text x="357.5" y="485.75" font-size="23" text-anchor="middle" fill="#b57413" font-weight="400">wᵢ = scoreᵢ / Σ_selected score</text><text x="357.5" y="516.75" font-size="23" text-anchor="middle" fill="#b57413" font-weight="400">384 个专家中仅激活 6 个</text></g><path d="M357,370 L357,430" fill="none" stroke="#b57413" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#b57413)"/><g id="m-routed" data-source=""><title>6 个 selected experts 并行</title><rect x="70" y="590" width="575" height="90" rx="12" fill="#fff6e6" stroke="#b57413" stroke-width="2"/><text x="357.5" y="627.75" font-size="25" text-anchor="middle" fill="#b57413" font-weight="700">6 个 selected experts 并行</text><text x="357.5" y="658.75" font-size="23" text-anchor="middle" fill="#b57413" font-weight="400">每个专家使用下面同一 SwiGLU 结构</text></g><path d="M357,525 L357,590" fill="none" stroke="#b57413" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#b57413)"/><rect x="710" y="440" width="670" height="620" rx="14" fill="white" stroke="#b57413" stroke-width="2" stroke-dasharray="10 7"/><text x="745" y="483" font-size="25" text-anchor="start" fill="#b57413" font-weight="700">单个专家：shared / routed 均适用</text><g id="m-gate" data-source=""><title>Gate Linear</title><rect x="735" y="550" width="280" height="85" rx="12" fill="#fff6e6" stroke="#b57413" stroke-width="2"/><text x="875.0" y="585.25" font-size="25" text-anchor="middle" fill="#b57413" font-weight="700">Gate Linear</text><text x="875.0" y="616.25" font-size="23" text-anchor="middle" fill="#b57413" font-weight="400">5120 → 2304</text></g><g id="m-up" data-source=""><title>Up Linear</title><rect x="1060" y="550" width="280" height="85" rx="12" fill="#fff6e6" stroke="#b57413" stroke-width="2"/><text x="1200.0" y="585.25" font-size="25" text-anchor="middle" fill="#b57413" font-weight="700">Up Linear</text><text x="1200.0" y="616.25" font-size="23" text-anchor="middle" fill="#b57413" font-weight="400">5120 → 2304</text></g><path d="M1100,370 L1100,510 L875,510 L875,550" fill="none" stroke="#b57413" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#b57413)"/><path d="M1100,510 L1200,510 L1200,550" fill="none" stroke="#b57413" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#b57413)"/><g id="m-silu" data-source=""><title>SiLU + clamp</title><rect x="735" y="700" width="280" height="60" rx="12" fill="#fff6e6" stroke="#b57413" stroke-width="2"/><text x="875.0" y="738.25" font-size="25" text-anchor="middle" fill="#b57413" font-weight="700">SiLU + clamp</text></g><path d="M875,635 L875,700" fill="none" stroke="#b57413" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#b57413)"/><circle cx="1040" cy="830" r="25" fill="white" stroke="#b57413" stroke-width="2.8"/><text x="1040" y="839" font-size="30" text-anchor="middle" fill="#b57413" font-weight="700">×</text><path d="M875,760 L875,830 L1015,830" fill="none" stroke="#b57413" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#b57413)"/><path d="M1200,635 L1200,830 L1065,830" fill="none" stroke="#b57413" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#b57413)"/><g id="m-down" data-source="model.py:DeepseekV41MLP.forward"><title>model.py:DeepseekV41MLP.forward</title><rect x="800" y="920" width="480" height="85" rx="12" fill="#fff6e6" stroke="#b57413" stroke-width="2"/><text x="1040.0" y="955.25" font-size="25" text-anchor="middle" fill="#b57413" font-weight="700">Down Linear 2304 → 5120</text><text x="1040.0" y="986.25" font-size="23" text-anchor="middle" fill="#b57413" font-weight="400">SwiGLU limit = 10；返回 [N,5120]</text></g><path d="M1040,855 L1040,920" fill="none" stroke="#b57413" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#b57413)"/><g id="m-sum" data-source=""><title>按路由权重加权求和，再 ×1.5</title><rect x="70" y="845" width="575" height="100" rx="12" fill="#fff6e6" stroke="#b57413" stroke-width="2"/><text x="357.5" y="871.92" font-size="24" text-anchor="middle" fill="#b57413" font-weight="700">按路由权重加权求和，再 ×1.5</text><text x="357.5" y="902.92" font-size="23" text-anchor="middle" fill="#b57413" font-weight="400">y_route = 1.5 × Σᵢ∈Top6 wᵢ Expertᵢ(x)</text><text x="357.5" y="933.92" font-size="23" text-anchor="middle" fill="#b57413" font-weight="400">各 expert 输出 [N,5120]</text></g><path d="M357,680 L357,845" fill="none" stroke="#b57413" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#b57413)"/><circle cx="720" cy="1140" r="28" fill="white" stroke="#b57413" stroke-width="2.8"/><text x="720" y="1149" font-size="30" text-anchor="middle" fill="#b57413" font-weight="700">+</text><path d="M357,945 L357,1140 L692,1140" fill="none" stroke="#b57413" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#b57413)"/><path d="M1040,1005 L1040,1140 L748,1140" fill="none" stroke="#b57413" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#b57413)"/><g id="m-out" data-source=""><title>y = y_route + y_shared → mHC post</title><rect x="350" y="1225" width="740" height="75" rx="12" fill="#fff6e6" stroke="#b57413" stroke-width="2"/><text x="720.0" y="1255.58" font-size="26" text-anchor="middle" fill="#b57413" font-weight="700">y = y_route + y_shared → mHC post</text><text x="720.0" y="1286.58" font-size="23" text-anchor="middle" fill="#b57413" font-weight="400">[N,5120]</text></g><path d="M720,1168 L720,1225" fill="none" stroke="#b57413" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#b57413)"/><text x="720" y="1364" font-size="21" text-anchor="middle" fill="#5c6d83" font-weight="400">源码还支持 token→expert 的 hash 路由；归档 config 未声明 num_hash_layers，无法确认分层范围。</text></g></svg>