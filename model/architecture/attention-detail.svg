<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2110" viewBox="0 0 1440 2110"><title>Attention 投影、压缩、Indexer、缓存与输出</title><desc>Logical dimensions, zero-based layers, source symbols in node tooltips. Solid arrows carry data; dashed lines denote control, coefficients or detail expansion.</desc><defs><marker id="20314c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#20314c"/></marker><marker id="2563b5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563b5"/></marker><marker id="087f87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f87"/></marker><marker id="7951ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7951ac"/></marker><marker id="b57413" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b57413"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial Unicode MS, Hiragino Sans GB, sans-serif"><rect x="1" y="1" width="1438" height="2108" rx="18" fill="white" stroke="#2563b5" stroke-width="2" stroke-dasharray="10 7"/><text x="30" y="52" font-size="35" text-anchor="start" fill="#2563b5" font-weight="700">A  Attention：由投影一路追到输出</text><text x="30" y="92" font-size="23" text-anchor="start" fill="#5c6d83" font-weight="400">64 Q heads ×512；1 组共享 KV；部分 RoPE=64 / 非 RoPE=448</text><text x="720" y="150" font-size="28" text-anchor="middle" fill="#2563b5" font-weight="700">归一化子层输入 x [N,5120]</text><path d="M720,170 L720,195 L240,195 L240,225" fill="none" stroke="#2563b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#2563b5)"/><path d="M720,170 L720,225" fill="none" stroke="#2563b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#2563b5)"/><path d="M720,195 L1190,195 L1190,225" fill="none" stroke="#2563b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#2563b5)"/><g id="a-qa" data-source="model.py:init_attention_projections; attention/dsa_v41.py:_project_q"><title>model.py:init_attention_projections; attention/dsa_v41.py:_project_q</title><rect x="45" y="225" width="390" height="75" rx="12" fill="#edf4ff" stroke="#2563b5" stroke-width="2"/><text x="240.0" y="254.92" font-size="24" text-anchor="middle" fill="#2563b5" font-weight="700">Wq_a 5120 → 1280</text><text x="240.0" y="285.91999999999996" font-size="23" text-anchor="middle" fill="#2563b5" font-weight="400">[N,1280] = q latent</text></g><g id="a-qnorm" data-source="model.py:init_attention_projections; attention/dsa_v41.py:_project_q"><title>model.py:init_attention_projections; attention/dsa_v41.py:_project_q</title><rect x="45" y="340" width="390" height="60" rx="12" fill="#edf4ff" stroke="#2563b5" stroke-width="2"/><text x="240.0" y="377.92" font-size="24" text-anchor="middle" fill="#2563b5" font-weight="700">RMSNorm(q latent)</text></g><path d="M240,300 L240,340" fill="none" stroke="#2563b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#2563b5)"/><g id="a-qb" data-source="model.py:init_attention_projections; attention/dsa_v41.py:_project_q"><title>model.py:init_attention_projections; attention/dsa_v41.py:_project_q</title><rect x="45" y="440" width="390" height="75" rx="12" fill="#edf4ff" stroke="#2563b5" stroke-width="2"/><text x="240.0" y="469.92" font-size="24" text-anchor="middle" fill="#2563b5" font-weight="700">Wq_b 1280 → 64 × 512</text><text x="240.0" y="500.92" font-size="23" text-anchor="middle" fill="#2563b5" font-weight="400">[N,64,512]</text></g><path d="M240,400 L240,440" fill="none" stroke="#2563b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#2563b5)"/><g id="a-qrope" data-source="model.py:init_attention_projections; attention/dsa_v41.py:_project_q"><title>model.py:init_attention_projections; attention/dsa_v41.py:_project_q</title><rect x="45" y="555" width="390" height="85" rx="12" fill="#edf4ff" stroke="#2563b5" stroke-width="2"/><text x="240.0" y="589.92" font-size="24" text-anchor="middle" fill="#2563b5" font-weight="700">部分 RoPE（后 64 维）</text><text x="240.0" y="620.92" font-size="23" text-anchor="middle" fill="#2563b5" font-weight="400">其余 448 维不旋转</text></g><path d="M240,515 L240,555" fill="none" stroke="#2563b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#2563b5)"/><g id="a-wkv" data-source="attention/dsa_v41.py:_project_kv; _write_swa_cache"><title>attention/dsa_v41.py:_project_kv; _write_swa_cache</title><rect x="525" y="225" width="390" height="75" rx="12" fill="#edf4ff" stroke="#2563b5" stroke-width="2"/><text x="720.0" y="254.92" font-size="24" text-anchor="middle" fill="#2563b5" font-weight="700">Wkv 5120 → 512</text><text x="720.0" y="285.91999999999996" font-size="23" text-anchor="middle" fill="#2563b5" font-weight="400">[N,1,512]</text></g><g id="a-kvnorm" data-source="attention/dsa_v41.py:_project_kv; _write_swa_cache"><title>attention/dsa_v41.py:_project_kv; _write_swa_cache</title><rect x="525" y="340" width="390" height="60" rx="12" fill="#edf4ff" stroke="#2563b5" stroke-width="2"/><text x="720.0" y="377.92" font-size="24" text-anchor="middle" fill="#2563b5" font-weight="700">RMSNorm(KV)</text></g><path d="M720,300 L720,340" fill="none" stroke="#2563b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#2563b5)"/><g id="a-kvrope" data-source="attention/dsa_v41.py:_project_kv; _write_swa_cache"><title>attention/dsa_v41.py:_project_kv; _write_swa_cache</title><rect x="525" y="440" width="390" height="75" rx="12" fill="#edf4ff" stroke="#2563b5" stroke-width="2"/><text x="720.0" y="469.92" font-size="24" text-anchor="middle" fill="#2563b5" font-weight="700">部分 RoPE（后 64 维）</text><text x="720.0" y="500.92" font-size="23" text-anchor="middle" fill="#2563b5" font-weight="400">与本层 Q 使用对应位置</text></g><path d="M720,400 L720,440" fill="none" stroke="#2563b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#2563b5)"/><g id="a-swa" data-source="attention/dsa_v41.py:_project_kv; _write_swa_cache"><title>attention/dsa_v41.py:_project_kv; _write_swa_cache</title><rect x="525" y="555" width="390" height="85" rx="12" fill="#edf4ff" stroke="#2563b5" stroke-width="2"/><text x="720.0" y="589.92" font-size="24" text-anchor="middle" fill="#2563b5" font-weight="700">写入本层 SWA cache</text><text x="720.0" y="620.92" font-size="23" text-anchor="middle" fill="#2563b5" font-weight="400">各层独有；window = 128</text></g><path d="M720,515 L720,555" fill="none" stroke="#2563b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#2563b5)"/><g id="a-c2" data-source="compressor.py:pool_projected; compressor_triton.py:compressor_ref"><title>compressor.py:pool_projected; compressor_triton.py:compressor_ref</title><rect x="1000" y="225" width="390" height="165" rx="12" fill="#f4effb" stroke="#7951ac" stroke-width="2"/><text x="1195.0" y="268.92" font-size="24" text-anchor="middle" fill="#7951ac" font-weight="700">C2：仅 L2 / L8 / L14</text><text x="1195.0" y="299.92" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">x→Wkv, Wgate：各 5120→512</text><text x="1195.0" y="330.92" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">每 2 token 按通道 softmax 池化</text><text x="1195.0" y="361.92" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">RMSNorm → latent [Tc,512]</text></g><g id="a-c1" data-source="compressor.py:forward"><title>compressor.py:forward</title><rect x="1000" y="440" width="390" height="100" rx="12" fill="#f4effb" stroke="#7951ac" stroke-width="2"/><text x="1195.0" y="467.25" font-size="25" text-anchor="middle" fill="#7951ac" font-weight="700">C1：仅 L20</text><text x="1195.0" y="498.25" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">Wkv 5120→512 → RMSNorm</text><text x="1195.0" y="529.25" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">逐 token latent；不压缩长度</text></g><path d="M1190,195 L1410,195 L1410,420 L1195,420 L1195,440" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><g id="a-latent" data-source=""><title>源层 latent（尚未 RoPE）</title><rect x="1000" y="590" width="390" height="65" rx="12" fill="#f4effb" stroke="#7951ac" stroke-width="2"/><text x="1195.0" y="630.42" font-size="24" text-anchor="middle" fill="#7951ac" font-weight="700">源层 latent（尚未 RoPE）</text></g><path d="M1195,390 L970,390 L970,622 L1000,622" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><path d="M1195,540 L1195,590" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><g id="a-long" data-source=""><title>部分 RoPE → 长程 KV cache</title><rect x="1000" y="715" width="390" height="95" rx="12" fill="#f4effb" stroke="#7951ac" stroke-width="2"/><text x="1195.0" y="739.09" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="700">部分 RoPE → 长程 KV cache</text><text x="1195.0" y="770.09" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">消费者直接读 source cache</text><text x="1195.0" y="801.09" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">C2: Tc≈⌊T/2⌋；C1: Tc=T</text></g><path d="M1195,655 L1195,715" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><rect x="35" y="865" width="1370" height="650" rx="14" fill="white" stroke="#7951ac" stroke-width="2" stroke-dasharray="10 7"/><text x="65" y="907" font-size="27" text-anchor="start" fill="#7951ac" font-weight="700">Indexer：只在 index source 层算 Top-K，消费者复用索引</text><g id="a-iq" data-source="indexer.py:project_query; apply_query_rope"><title>indexer.py:project_query; apply_query_rope</title><rect x="65" y="965" width="375" height="95" rx="12" fill="#f4effb" stroke="#7951ac" stroke-width="2"/><text x="252.5" y="989.42" font-size="24" text-anchor="middle" fill="#7951ac" font-weight="700">q latent → Wq_b(index)</text><text x="252.5" y="1020.42" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">1280 → 32 heads ×128</text><text x="252.5" y="1051.42" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">后 64 维做 RoPE</text></g><path d="M435,370 L475,370 L475,940 L252,940 L252,965" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><g id="a-ik" data-source="indexer.py:update_keys"><title>indexer.py:update_keys</title><rect x="535" y="965" width="375" height="95" rx="12" fill="#f4effb" stroke="#7951ac" stroke-width="2"/><text x="722.5" y="989.09" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="700">源 latent → Wk → RMSNorm</text><text x="722.5" y="1020.09" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">512 → 128 → 部分 RoPE</text><text x="722.5" y="1051.0900000000001" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">写入 source index-K cache</text></g><path d="M1000,622 L940,622 L940,940 L722,940 L722,965" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><g id="a-iw" data-source="indexer.py:project_weights"><title>indexer.py:project_weights</title><rect x="1005" y="965" width="365" height="95" rx="12" fill="#f4effb" stroke="#7951ac" stroke-width="2"/><text x="1187.5" y="989.42" font-size="24" text-anchor="middle" fill="#7951ac" font-weight="700">x → weights_proj</text><text x="1187.5" y="1020.42" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">5120 → 32 个 head 权重</text><text x="1187.5" y="1051.42" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">× (1/√128) × (1/√32)</text></g><text x="1187" y="930" font-size="22" text-anchor="middle" fill="#7951ac" font-weight="400">来自当前层 x</text><path d="M1187,938 L1187,965" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><g id="a-iscore" data-source="indexer.py:select_projected"><title>indexer.py:select_projected</title><rect x="265" y="1130" width="910" height="80" rx="12" fill="#f4effb" stroke="#7951ac" stroke-width="2"/><text x="720.0" y="1162.75" font-size="25" text-anchor="middle" fill="#7951ac" font-weight="700">量化 Q / K → 加权索引打分（causal）</text><text x="720.0" y="1193.75" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">32 index heads 的 QK score → 候选 / Top-K</text></g><path d="M252,1060 L252,1095 L720,1095 L720,1130" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><path d="M722,1060 L722,1095 L720,1095 L720,1130" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><path d="M1187,1060 L1187,1095 L720,1095 L720,1130" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><g id="a-ipolicy" data-source=""><title>L2 / 8 / 14 / 20：直接搜索；L20 同时产候选</title><rect x="90" y="1270" width="790" height="110" rx="12" fill="#f4effb" stroke="#7951ac" stroke-width="2"/><text x="485.0" y="1301.92" font-size="24" text-anchor="middle" fill="#7951ac" font-weight="700">L2 / 8 / 14 / 20：直接搜索；L20 同时产候选</text><text x="485.0" y="1332.92" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">L24 / 28 / 32 / 36：只在 L20 候选中重选</text><text x="485.0" y="1363.92" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">候选 2048 blocks ×8 tokens → 最终 Top-512 位置</text></g><path d="M720,1210 L720,1270" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><g id="a-topk" data-source=""><title>共享 Top-K index buffer</title><rect x="965" y="1280" width="390" height="95" rx="12" fill="#f4effb" stroke="#7951ac" stroke-width="2"/><text x="1160.0" y="1304.09" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="700">共享 Top-K index buffer</text><text x="1160.0" y="1335.09" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">[N,512]，不是 Attention 输出</text><text x="1160.0" y="1366.09" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">其余层不重新跑 Indexer</text></g><path d="M880,1325 L965,1325" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><text x="720" y="1470" font-size="22" text-anchor="middle" fill="#7951ac" font-weight="400">index source = {2,8,14,20,24,28,32,36}；index-K 始终来自对应 KV source</text><g id="a-sparse" data-source="attention/dsa_v41.py:_forward_attention"><title>attention/dsa_v41.py:_forward_attention</title><rect x="275" y="1600" width="890" height="130" rx="12" fill="#edf4ff" stroke="#2563b5" stroke-width="2"/><text x="720.0" y="1642.58" font-size="26" text-anchor="middle" fill="#2563b5" font-weight="700">一个 SparseFlashMLA / QSMLA 注意力计算</text><text x="720.0" y="1673.58" font-size="23" text-anchor="middle" fill="#2563b5" font-weight="400">Q + 本层 SWA KV + source 长程 KV[Top-512] + learned sink</text><text x="720.0" y="1704.58" font-size="23" text-anchor="middle" fill="#2563b5" font-weight="400">两类 KV 共同参与注意力归一化；不是两份输出相加</text></g><path d="M240,640 L20,640 L20,1665 L275,1665" fill="none" stroke="#2563b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#2563b5)"/><path d="M720,640 L720,835 L1430,835 L1430,1755 L920,1755 L920,1730" fill="none" stroke="#2563b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#2563b5)"/><path d="M1390,762 L1415,762 L1415,1560 L1040,1560 L1040,1600" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><path d="M1160,1375 L1160,1540 L810,1540 L810,1600" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><g id="a-oa" data-source=""><title>分成 8 组 → Wo_a：每组 4096 → rank 1024</title><rect x="225" y="1810" width="990" height="85" rx="12" fill="#edf4ff" stroke="#2563b5" stroke-width="2"/><text x="720.0" y="1845.58" font-size="26" text-anchor="middle" fill="#2563b5" font-weight="700">分成 8 组 → Wo_a：每组 4096 → rank 1024</text><text x="720.0" y="1876.58" font-size="23" text-anchor="middle" fill="#2563b5" font-weight="400">[N,64,512] → [N,8,1024] → concat 8192</text></g><path d="M720,1730 L720,1810" fill="none" stroke="#2563b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#2563b5)"/><g id="a-ob" data-source=""><title>Wo_b 8192 → 5120 → 返回 mHC post</title><rect x="225" y="1955" width="990" height="85" rx="12" fill="#edf4ff" stroke="#2563b5" stroke-width="2"/><text x="720.0" y="1990.58" font-size="26" text-anchor="middle" fill="#2563b5" font-weight="700">Wo_b 8192 → 5120 → 返回 mHC post</text><text x="720.0" y="2021.58" font-size="23" text-anchor="middle" fill="#2563b5" font-weight="400">[N,5120]；8 groups ×1024 是输出低秩瓶颈</text></g><path d="M720,1895 L720,1955" fill="none" stroke="#2563b5" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#2563b5)"/><text x="720" y="2082" font-size="21" text-anchor="middle" fill="#5c6d83" font-weight="400">物理 cache 依硬件选择；950DT/A5：SWA FP8 + BF16 scale，长程 KV FP4 + BF16 scale</text></g></svg>