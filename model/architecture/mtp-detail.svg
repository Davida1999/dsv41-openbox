<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="650" viewBox="0 0 1480 650"><title>MTP DSpark 可选执行分支</title><desc>Logical dimensions, zero-based layers, source symbols in node tooltips. Solid arrows carry data; dashed lines denote control, coefficients or detail expansion.</desc><defs><marker id="20314c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#20314c"/></marker><marker id="2563b5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563b5"/></marker><marker id="087f87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f87"/></marker><marker id="7951ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7951ac"/></marker><marker id="b57413" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b57413"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial Unicode MS, Hiragino Sans GB, sans-serif"><rect x="1" y="1" width="1478" height="648" rx="18" fill="white" stroke="#7951ac" stroke-width="2" stroke-dasharray="10 7"/><text x="30" y="52" font-size="35" text-anchor="start" fill="#7951ac" font-weight="700">05  MTP / DSpark：独立的三层草稿分支</text><text x="30" y="92" font-size="23" text-anchor="start" fill="#5c6d83" font-weight="400">结构存在；归档服务未启用投机解码，本次只核对静态路径</text><g id="s-target" data-source=""><title>主干 target states [37,38,39] → concat</title><rect x="45" y="145" width="665" height="85" rx="12" fill="#f4effb" stroke="#7951ac" stroke-width="2"/><text x="377.5" y="179.92" font-size="24" text-anchor="middle" fill="#7951ac" font-weight="700">主干 target states [37,38,39] → concat</text><text x="377.5" y="210.92" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">3 ×5120 → main_proj 15360→5120 → RMSNorm</text></g><g id="s-cache" data-source=""><title>预计算每个 draft layer 的上下文 SWA KV</title><rect x="825" y="145" width="610" height="85" rx="12" fill="#f4effb" stroke="#7951ac" stroke-width="2"/><text x="1130.0" y="179.59" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="700">预计算每个 draft layer 的上下文 SWA KV</text><text x="1130.0" y="210.59" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">packed Wkv → KV norm → RoPE → 各层 cache</text></g><path d="M710,187 L825,187" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><g id="s-embed" data-source=""><title>draft token / noise</title><rect x="45" y="305" width="310" height="90" rx="12" fill="#f4effb" stroke="#7951ac" stroke-width="2"/><text x="200.0" y="342.42" font-size="24" text-anchor="middle" fill="#7951ac" font-weight="700">draft token / noise</text><text x="200.0" y="373.42" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">Embedding → mHC ×4</text></g><g id="s-layer0" data-source=""><title>mtp.0 / L40</title><rect x="420" y="305" width="285" height="90" rx="12" fill="#f4effb" stroke="#7951ac" stroke-width="2"/><text x="562.5" y="342.42" font-size="24" text-anchor="middle" fill="#7951ac" font-weight="700">mtp.0 / L40</text><text x="562.5" y="373.42" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">SWA + MoE 128 / Top-3</text></g><g id="s-layer1" data-source=""><title>mtp.1 / L41</title><rect x="765" y="305" width="285" height="90" rx="12" fill="#f4effb" stroke="#7951ac" stroke-width="2"/><text x="907.5" y="342.42" font-size="24" text-anchor="middle" fill="#7951ac" font-weight="700">mtp.1 / L41</text><text x="907.5" y="373.42" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">SWA + MoE 128 / Top-3</text></g><g id="s-layer2" data-source=""><title>mtp.2 / L42</title><rect x="1110" y="305" width="285" height="90" rx="12" fill="#f4effb" stroke="#7951ac" stroke-width="2"/><text x="1252.5" y="342.42" font-size="24" text-anchor="middle" fill="#7951ac" font-weight="700">mtp.2 / L42</text><text x="1252.5" y="373.42" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">SWA + MoE 128 / Top-3</text></g><path d="M355,350 L420,350" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><path d="M705,350 L765,350" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><path d="M1050,350 L1110,350" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><path d="M1130,230 L1130,270 L562,270 L562,305" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#7951ac)"/><text x="950" y="255" font-size="22" text-anchor="middle" fill="#7951ac" font-weight="400">各 draft 层读上下文 KV</text><g id="s-head" data-source=""><title>mHC collapse → RMSNorm → LM Head / Markov rank 256</title><rect x="420" y="460" width="975" height="100" rx="12" fill="#f4effb" stroke="#7951ac" stroke-width="2"/><text x="907.5" y="487.25" font-size="25" text-anchor="middle" fill="#7951ac" font-weight="700">mHC collapse → RMSNorm → LM Head / Markov rank 256</text><text x="907.5" y="518.25" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">token logits + Markov bias；confidence head → sigmoid</text><text x="907.5" y="549.25" font-size="23" text-anchor="middle" fill="#7951ac" font-weight="400">dspark_block_size = 5 是配置项，不代表 5 个 MTP 层</text></g><path d="M1252,395 L1252,460" fill="none" stroke="#7951ac" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#7951ac)"/><text x="45" y="620" font-size="22" text-anchor="start" fill="#5c6d83" font-weight="400">target_layer_ids 的取样点按 runner 约定；实际取进入对应层的 residual mean。</text></g></svg>